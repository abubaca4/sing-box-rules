name: Build sing-box Rule Sets

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ЭТАП 1: Параллельная генерация правил через матрицу
  build-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Упавший скрипт не отменяет выполнение остальных
      matrix:
        rule:
          - global-tlds
          - router-domains
          # При добавлении нового скрипта просто впишите его имя без .py-

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main

      # Сверяемся с веткой rule-sets, чтобы utils.py мог сравнить JSON с предыдущей версией
      - name: Checkout rule-sets
        uses: actions/checkout@v7
        with:
          ref: rule-sets
          path: publish

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: main/scripts/requirements.txt

      - name: Install dependencies & sing-box
        run: |
          pip install -r main/scripts/requirements.txt
          bash <(curl -fsSL https://sing-box.app/deb-install.sh)

      - name: Run script
        run: |
          cd main/scripts
          python ${{ matrix.rule }}.py

      - name: Upload Rule Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rule-${{ matrix.rule }}
          path: |
            publish/${{ matrix.rule }}.json
            publish/${{ matrix.rule }}.srs
          if-no-files-found: ignore

  # ЭТАП 2: Сборка всех результатов и коммит в ветку rule-sets
  publish-rules:
    runs-on: ubuntu-latest
    needs: build-rules
    if: always() # Выполняется даже если часть матричных задач упала с ошибкой

    steps:
      - name: Checkout rule-sets branch
        uses: actions/checkout@v7
        with:
          ref: rule-sets

      - name: Download all rule artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rule-*
          merge-multiple: true
          path: .

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update rule sets: $(date -u +'%Y-%m-%d')"
            git push origin rule-sets
          fi
